# Remove obsolete bindings from the previous Omarchy configuration.
unbind -n M-S-Left
unbind -n M-S-Right
unbind -n C-M-S-Up
unbind -n C-M-S-Down

# Prefix
set -g prefix C-a
set -g prefix2 None
unbind C-b
unbind C-Space
bind C-Space copy-mode
bind Space copy-mode
bind C-a send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

# Pane Controls
bind -n M-Enter split-window -h -l 110 -c "#{pane_current_path}"
bind -n M-S-Enter split-window -v -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# bind -n C-M-S-Left resize-pane -L 5
# bind -n C-M-S-Down resize-pane -D 5
# bind -n C-M-S-Up resize-pane -U 5
# bind -n C-M-S-Right resize-pane -R 5

# Leave Alt+h available to applications (Snacks toggles hidden files).
unbind -n M-h

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{session_path}"
bind k kill-window

bind -n M-1 select-window -t :1
bind -n C-1 run-shell "\"$HOME/.config/tmux/session-number\" 1"
bind -n M-2 select-window -t :2
bind -n C-2 run-shell "\"$HOME/.config/tmux/session-number\" 2"
bind -n M-3 select-window -t :3
bind -n C-3 run-shell "\"$HOME/.config/tmux/session-number\" 3"
bind -n M-4 select-window -t :4
bind -n C-4 run-shell "\"$HOME/.config/tmux/session-number\" 4"
bind -n M-5 select-window -t :5
bind -n C-5 run-shell "\"$HOME/.config/tmux/session-number\" 5"
bind -n M-6 select-window -t :6
bind -n C-6 run-shell "\"$HOME/.config/tmux/session-number\" 6"
bind -n M-7 select-window -t :7
bind -n C-7 run-shell "\"$HOME/.config/tmux/session-number\" 7"
bind -n M-8 select-window -t :8
bind -n C-8 run-shell "\"$HOME/.config/tmux/session-number\" 8"
bind -n M-9 select-window -t :9
bind -n C-9 run-shell "\"$HOME/.config/tmux/session-number\" 9"

bind -n C-M-Left select-window -t -1
bind -n C-M-Right select-window -t +1
bind -n C-M-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C display-popup -E -w 70% -h 60% "\"$HOME/.config/tmux/project\""
bind S choose-tree -Zs
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n C-M-Up switch-client -p
bind -n C-M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -ag terminal-features "xterm-256color:extkeys"
set -sg escape-time 10
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"


# Keep the Omarchy help popup and vi copy behavior.
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "\"$HOME/.config/tmux/help\" | less -R"
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# BEGIN Agamotto agent sidebar
source-file -q "$HOME/.config/dotfiles/themes/agamotto/tmux.conf"
source-file -q "$HOME/.local/state/omarchy/current/theme/tmux.conf"
set -g @sidebar_key e
set -g @sidebar_key_all E
set -g @sidebar_width 24
set -g @sidebar_position left
set -g @sidebar_auto_create off
set -g @sidebar_pet off
set -g @agent-sidebar-default-agent codex
if-shell 'test -x "$HOME/.local/share/tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux"' 'run-shell "\"$HOME/.local/share/tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux\""'
# END Agamotto agent sidebar

source-file -q "$HOME/.config/tmux/local.conf"
