[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font Mono:style=Medium:size=9
pad=0x0
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=underline
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

# Readable ANSI red/green and opacity overrides; other colors come from the theme.
[colors-dark]
alpha=0.90
regular1=FF4D6D
regular2=33FF44
bright1=FF708C
bright2=33FF44
selection-foreground=FFFFFF
selection-background=5B4B8A

[text-bindings]
\x1b[49;5u=Control+1
\x1b[50;5u=Control+2
\x1b[51;5u=Control+3
\x1b[52;5u=Control+4
\x1b[53;5u=Control+5
\x1b[54;5u=Control+6
\x1b[55;5u=Control+7
\x1b[56;5u=Control+8
\x1b[57;5u=Control+9

# Per-machine font size/opacity; created by the installer.
[main]
include=~/.config/foot/local.ini
